<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Cricket Scores - Cricket Hub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #222;
        }

        header {
            background: #0b7a3b;
            color: white;
            padding: 18px 10px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 15px;
            font-size: 28px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        nav a {
            color: white;
            text-decoration: none;
            background: #096631;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        nav a:hover {
            background: #075126;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        h2 {
            text-align: center;
            color: #0b7a3b;
            margin-bottom: 25px;
        }

        .live-heading {
            text-align: center;
            font-weight: bold;
            color: #d00000;
            margin-bottom: 20px;
        }

        #status {
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
        }

        #matches {
            display: grid;
            gap: 18px;
        }

        .match {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .match-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 18px;
            color: #0b7a3b;
        }

        .team {
            font-size: 19px;
            font-weight: bold;
            margin: 8px 0;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0 12px;
        }

        .match-status {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 12px;
            border-radius: 20px;
            background: #eee;
            font-size: 13px;
            font-weight: bold;
        }

        .refresh-btn {
            display: block;
            margin: 25px auto;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #0b7a3b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #075126;
        }

        .error {
            background: #ffe5e5;
            color: #b00000;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background: #0b7a3b;
            color: white;
            text-align: center;
        }

        footer a {
            color: white;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 23px;
            }

            nav a {
                font-size: 12px;
                padding: 7px 9px;
            }

            main {
                margin-top: 20px;
            }

            .match {
                padding: 16px;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>🏏 Cricket Hub</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="news.html">News</a>

            <a href="players.html">Players</a>

            <a href="teams.html">Teams</a>

            <a href="stories.html">Stories</a>

            <a href="scenarios.html">Scenarios</a>

            <a href="match.html">Match Mode</a>

            <a href="achievements.html">🏆 Achievements</a>

            <a href="live.html">🔴 Live Scores</a>

        </nav>

    </header>


    <main>

        <h2>🔴 Live Cricket Scores</h2>

        <div class="live-heading">
            ● LIVE MATCHES
        </div>

        <div id="status">
            Loading live scores...
        </div>

        <div id="matches"></div>

        <button class="refresh-btn" onclick="loadScores()">
            🔄 Refresh Scores
        </button>

    </main>


    <footer>

        <p>Cricket Hub © 2026</p>

        <p>
            Live sports data powered by
            <a href="https://sportscore.com/" target="_blank">
                SportScore
            </a>
        </p>

    </footer>


    <script>

        const API =
            "https://sportscore.com/api/widget/matches/?sport=cricket&limit=20";


        async function loadScores() {

            const status =
                document.getElementById("status");

            const matches =
                document.getElementById("matches");


            status.textContent =
                "Loading live scores...";

            matches.innerHTML = "";


            try {

                const response =
                    await fetch(API);


                if (!response.ok) {

                    throw new Error(
                        "API request failed"
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "SportScore data:",
                    data
                );


                const list =
                    data.matches || [];


                if (!list.length) {

                    status.textContent =
                        "No cricket matches found right now.";

                    return;

                }


                status.textContent =
                    "🏏 Cricket Matches";


                list.forEach(match => {

                    const card =
                        document.createElement("div");


                    card.className =
                        "match";


                    const home =
                        match.home ||
                        "Unknown Team";


                    const away =
                        match.away ||
                        "Unknown Team";


                    const homeScore =
                        match.home_score ?? "-";


                    const awayScore =
                        match.away_score ?? "-";


                    const matchStatus =
                        match.status ||
                        "Match information";


                    const homeLogo =
                        match.home_logo || "";


                    const awayLogo =
                        match.away_logo || "";


                    card.innerHTML = `

                        <div class="match-title">
                            🏏 Cricket Match
                        </div>


                        <div class="team">

                            ${
                                homeLogo
                                ? `
                                    <img
                                        src="${homeLogo}"
                                        alt="${home}"
                                        style="
                                            width:40px;
                                            height:40px;
                                            object-fit:contain;
                                            vertical-align:middle;
                                            margin-right:8px;
                                        "
                                    >
                                  `
                                : ""
                            }

                            ${home}

                        </div>


                        <div class="score">
                            ${homeScore}
                        </div>


                        <div class="team">

                            ${
                                awayLogo
                                ? `
                                    <img
                                        src="${awayLogo}"
                                        alt="${away}"
                                        style="
                                            width:40px;
                                            height:40px;
                                            object-fit:contain;
                                            vertical-align:middle;
                                            margin-right:8px;
                                        "
                                    >
                                  `
                                : ""
                            }

                            ${away}

                        </div>


                        <div class="score">
                            ${awayScore}
                        </div>


                        <div class="match-status">
                            ${String(matchStatus).toUpperCase()}
                        </div>

                    `;


                    matches.appendChild(card);

                });


            } catch (error) {

                console.error(
                    "Live score error:",
                    error
                );


                status.innerHTML = `

                    <div class="error">

                        ❌ Couldn't load live scores right now.

                        <br><br>

                        Try the Refresh button.

                    </div>

                `;

            }

        }


        // Load scores when page opens
        loadScores();


        // Automatically refresh every 60 seconds
        setInterval(
            loadScores,
            60000
        );

    </script>

</body>

</html>
