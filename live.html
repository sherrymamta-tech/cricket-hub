<section class="title">
    <h2>🔴 Live Cricket Scores</h2>
    <div class="live">● LIVE MATCHES</div>
</section>

<div class="container">

    <div id="status" class="status">
        Loading live scores...
    </div>

    <div id="matches"></div>

    <button class="refresh" onclick="loadScores()">
        🔄 Refresh Scores
    </button>

</div>

<footer>
    <p>Cricket Hub © 2026</p>

    <p>
        Live sports data powered by
        <a href="https://sportscore.com/" target="_blank">
            SportScore
        </a>
    </p>
</footer>

<script>

const API =
    "https://sportscore.com/api/widget/matches/?sport=cricket&limit=20";

async function loadScores() {

    const status = document.getElementById("status");
    const matches = document.getElementById("matches");

    status.textContent = "Loading live scores...";
    matches.innerHTML = "";

    try {

        const response = await fetch(API);

        if (!response.ok) {
            throw new Error("API request failed");
        }

        const data = await response.json();

        console.log("SportScore data:", data);

        const list =
            data.matches ||
            data.data ||
            data.results ||
            [];

        if (!list.length) {

            status.textContent =
                "No live cricket matches found right now.";

            return;
        }

        status.textContent =
            "Live cricket information";

        list.forEach(match => {

            const card =
                document.createElement("div");

            card.className = "match";

            const home =
                match.home_team?.name ||
                match.homeTeam?.name ||
                match.home_team ||
                match.homeTeam ||
                "Team A";

            const away =
                match.away_team?.name ||
                match.awayTeam?.name ||
                match.away_team ||
                match.awayTeam ||
                "Team B";

            const homeScore =
                match.home_team?.score ||
                match.homeScore ||
                "";

            const awayScore =
                match.away_team?.score ||
                match.awayScore ||
                "";

            const statusText =
                match.status ||
                match.match_status ||
                "Match information";

            card.innerHTML = `
                <div class="match-title">
                    🏏 ${match.name || match.title || "Cricket Match"}
                </div>

                <div class="teams">
                    ${home}
                </div>

                <div class="score">
                    ${homeScore || "—"}
                </div>

                <div class="teams">
                    ${away}
                </div>

                <div class="score">
                    ${awayScore || "—"}
                </div>

                <div class="match-status">
                    ${statusText}
                </div>
            `;

            matches.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        status.innerHTML = `
            <div class="error">
                ❌ Couldn't load live scores right now.
                <br><br>
                Try the Refresh button.
            </div>
        `;
    }
}

loadScores();

/* Refresh every 60 seconds */
setInterval(loadScores, 60000);

</script>
