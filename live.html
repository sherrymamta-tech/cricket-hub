
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Cricket Scores - Cricket Hub</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #222;
}

header {
    background: #0b7a3b;
    color: white;
    padding: 18px 10px;
    text-align: center;
}

header h1 {
    margin: 0 0 15px;
    font-size: 28px;
}

nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
}

nav a {
    color: white;
    text-decoration: none;
    background: #096631;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
}

nav a:hover {
    background: #075126;
}

main {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 15px;
}

h2 {
    text-align: center;
    color: #0b7a3b;
}

.section-title {
    margin-top: 35px;
    margin-bottom: 15px;
    font-size: 22px;
    font-weight: bold;
}

.live-title {
    color: #d00000;
}

.history-title {
    color: #0b7a3b;
}

#searchBar {
    width: 100%;
    max-width: 700px;
    display: block;
    margin: 20px auto 30px;
    padding: 15px;
    font-size: 16px;
    border: 2px solid #0b7a3b;
    border-radius: 10px;
    outline: none;
}

#searchBar:focus {
    box-shadow: 0 0 7px rgba(11,122,59,0.3);
}

#matches,
#history {
    display: grid;
    gap: 18px;
}

.match {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

.match-title {
    font-size: 18px;
    font-weight: bold;
    color: #0b7a3b;
    margin-bottom: 15px;
}

.team {
    font-size: 19px;
    font-weight: bold;
    margin: 8px 0;
}

.score {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 12px;
}

.match-status {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    background: #eeeeee;
    font-size: 13px;
    font-weight: bold;
}

.history-card {
    border-left: 5px solid #0b7a3b;
}

.date {
    color: #666;
    font-size: 14px;
    margin-bottom: 10px;
}

.competition {
    color: #777;
    font-size: 14px;
    margin-top: 10px;
}

.result {
    font-weight: bold;
    margin-top: 12px;
}

.refresh-btn,
.load-btn,
.scorecard-btn {
    display: block;
    margin: 20px auto;
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    background: #0b7a3b;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.refresh-btn:hover,
.load-btn:hover,
.scorecard-btn:hover {
    background: #075126;
}

.hidden {
    display: none;
}

.message {
    text-align: center;
    padding: 20px;
    background: white;
    border-radius: 10px;
}

.error {
    background: #ffe5e5;
    color: #b00000;
    padding: 18px;
    border-radius: 10px;
    text-align: center;
}

#scorecardSection {
    margin-top: 45px;
}

.scorecard-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    margin-bottom: 20px;
    overflow-x: auto;
}

.scorecard-box h3 {
    color: #0b7a3b;
    border-bottom: 2px solid #0b7a3b;
    padding-bottom: 8px;
}

.scorecard-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 14px;
}

.scorecard-table th,
.scorecard-table td {
    padding: 9px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

.scorecard-table th {
    background: #f0f5f2;
}

.scorecard-total {
    font-size: 18px;
    font-weight: bold;
    margin-top: 15px;
}

.close-scorecard {
    display: block;
    margin: 15px auto 30px;
    padding: 11px 20px;
    border: none;
    border-radius: 8px;
    background: #d00000;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

footer {
    margin-top: 40px;
    padding: 20px;
    background: #0b7a3b;
    color: white;
    text-align: center;
}

footer a {
    color: white;
}

@media (max-width:600px) {

    header h1 {
        font-size: 23px;
    }

    nav a {
        font-size: 12px;
        padding: 7px 9px;
    }

    .match {
        padding: 16px;
    }

    .scorecard-table {
        font-size: 12px;
    }

}

</style>
</head>

<body>

<header>

<h1>🏏 Cricket Hub</h1>

<nav>
<a href="index.html">Home</a>
<a href="news.html">News</a>
<a href="players.html">Players</a>
<a href="teams.html">Teams</a>
<a href="stories.html">Stories</a>
<a href="scenarios.html">Scenarios</a>
<a href="match.html">Match Mode</a>
<a href="achievements.html">🏆 Achievements</a>
<a href="live.html">🔴 Live Scores</a>
</nav>

</header>

<main>

<h2>🏏 Cricket Scores & History</h2>

<input
    type="text"
    id="searchBar"
    placeholder="🔎 Search teams, tournaments or matches..."
    oninput="searchEverything()"
>

<!-- LIVE -->

<div class="section-title live-title">
🔴 LIVE MATCHES
</div>

<div id="liveStatus">
Loading live scores...
</div>

<div id="matches"></div>

<button
    class="refresh-btn"
    onclick="loadLiveScores()"
>
🔄 Refresh Live Scores
</button>


<!-- HISTORY -->

<div class="section-title history-title">
📚 MATCH HISTORY
</div>

<div id="history"></div>

<button
    id="loadMoreBtn"
    class="load-btn"
    onclick="loadMoreHistory()"
>
Load More Matches
</button>


<!-- SCORECARD -->

<div id="scorecardSection" class="hidden">

<div class="section-title history-title">
📊 FULL SCORECARD
</div>

<div id="scorecard"></div>

<button
    class="close-scorecard"
    onclick="closeScorecard()"
>
✖ Close Scorecard
</button>

</div>

</main>


<footer>

<p>Cricket Hub © 2026</p>

<p>
Live sports data powered by
<a
    href="https://sportscore.com/"
    target="_blank"
>
SportScore
</a>
</p>

</footer>

<script>

/* =========================================
   LIVE SCORES
========================================= */

const API =
"https://sportscore.com/api/widget/matches/?sport=cricket&limit=50";

let liveMatches = [];


async function loadLiveScores() {
async function loadLiveScores() {

    const status = document.getElementById("liveStatus");
    const container = document.getElementById("matches");

    status.textContent = "⚡ Loading live scores...";
    
    // Don't erase existing scores while refreshing
    // container.innerHTML = "";

    const controller = new AbortController();

    // Stop waiting after 8 seconds
    const timeout = setTimeout(() => {
        controller.abort();
    }, 8000);

    try {

        const response = await fetch(API, {
            signal: controller.signal,
            cache: "no-store"
        });

        clearTimeout(timeout);

        if (!response.ok) {
            throw new Error("API request failed");
        }

        const data = await response.json();

        console.log("SportScore data:", data);

        liveMatches = data.matches || [];

        renderLiveMatches(liveMatches);

    }

    catch(error) {

        clearTimeout(timeout);

        console.error("Live score error:", error);

        status.innerHTML = `
        <div class="error">
            ❌ Live scores are taking too long to respond.
            <br><br>
            Your Match History is still available.
            <br><br>
            <button
                class="refresh-btn"
                onclick="loadLiveScores()"
                style="margin:10px auto 0;"
            >
                🔄 Try Again
            </button>
        </div>
        `;

    }

}
    


/* =========================================
   RENDER LIVE MATCHES
========================================= */

function renderLiveMatches(list) {

    const container =
    document.getElementById("matches");

    const status =
    document.getElementById("liveStatus");

    container.innerHTML = "";

    if (!list.length) {

        status.textContent =
        "No matches found.";

        return;

    }

    status.textContent =
    list.length +
    " cricket matches found";


    list.forEach(match => {

        const card =
        document.createElement("div");

        card.className =
        "match";

        const home =
        match.home ||
        "Unknown Team";

        const away =
        match.away ||
        "Unknown Team";

        const homeScore =
        match.home_score ?? "-";

        const awayScore =
        match.away_score ?? "-";

        const matchStatus =
        match.status ||
        "Match information";


        card.innerHTML = `

        <div class="match-title">
        🏏 Cricket Match
        </div>

        <div class="team">
        ${escapeHTML(home)}
        </div>

        <div class="score">
        ${escapeHTML(homeScore)}
        </div>

        <div class="team">
        ${escapeHTML(away)}
        </div>

        <div class="score">
        ${escapeHTML(awayScore)}
        </div>

        <div class="match-status">
        ${escapeHTML(String(matchStatus).toUpperCase())}
        </div>

        `;

        container.appendChild(card);

    });

}


/* =========================================
   MATCH HISTORY DATABASE
========================================= */

let matchHistory = [];

let historyShown = 6;


/* =========================================
   LOAD MATCH HISTORY
========================================= */

async function loadMatchHistory() {

    try {

        const response =
        await fetch("data/matches.json");

        if (!response.ok) {

            throw new Error(
                "History database could not be loaded"
            );

        }

        const data =
        await response.json();

        matchHistory =
        data.matches || [];

        console.log(
            "Match history loaded:",
            matchHistory.length
        );

        renderHistory(matchHistory);

    }

    catch(error) {

        console.error(error);

        document.getElementById("history").innerHTML = `
        <div class="error">
        ❌ Couldn't load match history.
        </div>
        `;

        document
        .getElementById("loadMoreBtn")
        .classList.add("hidden");

    }

}


/* =========================================
   RENDER HISTORY
========================================= */

function renderHistory(list) {

    const container =
    document.getElementById("history");

    const loadButton =
    document.getElementById("loadMoreBtn");

    container.innerHTML = "";

    const visible =
    list.slice(0, historyShown);


    visible.forEach(match => {

        const card =
        document.createElement("div");

        card.className =
        "match history-card";


        const teams =
        Array.isArray(match.teams)
        ? match.teams.join(" vs ")
        : (match.teams || "Unknown Teams");


        const score =
        match.score ||
        getHistoryScore(match);


        card.innerHTML = `

        <div class="match-title">
        🏏 ${escapeHTML(teams)}
        </div>

        <div class="date">
        📅 ${escapeHTML(match.date || "Unknown Date")}
        </div>

        <div class="score">
        ${escapeHTML(score)}
        </div>

        <div class="result">
        🏆 ${escapeHTML(match.result || "Result unavailable")}
        </div>

        <div class="competition">
        🏆 ${escapeHTML(match.competition || "Cricket Match")}
        </div>

        <div class="competition">
        📍 ${escapeHTML(match.venue || "Venue unavailable")}
        </div>

        <div class="competition">
        🏏 ${escapeHTML(match.format || "Format unavailable")}
        </div>

        <button
        class="scorecard-btn"
        onclick="showScorecard('${escapeHTML(match.id)}')"
        >
        📊 View Full Scorecard
        </button>

        `;


        container.appendChild(card);

    });


    if (historyShown >= list.length) {

        loadButton.classList.add("hidden");

    }

    else {

        loadButton.classList.remove("hidden");

    }


    if (!list.length) {

        container.innerHTML = `
        <div class="message">
        ❌ No matches found.
        </div>
        `;

        loadButton.classList.add("hidden");

    }

}


/* =========================================
   HISTORY SCORE DISPLAY
========================================= */

function getHistoryScore(match) {

    if (!match.innings) {
        return "-";
    }

    return "-";

}


/* =========================================
   LOAD MORE
========================================= */

function loadMoreHistory() {

    historyShown += 6;

    const search =
    document.getElementById("searchBar")
    .value
    .toLowerCase()
    .trim();

    const filteredHistory =
    filterHistory(search);

    renderHistory(filteredHistory);

}


/* =========================================
   SEARCH EVERYTHING
========================================= */

function searchEverything() {

    const search =
    document.getElementById("searchBar")
    .value
    .toLowerCase()
    .trim();


    const filteredLive =
    liveMatches.filter(match => {

        const home =
        (match.home || "")
        .toLowerCase();

        const away =
        (match.away || "")
        .toLowerCase();

        return (
            home.includes(search) ||
            away.includes(search)
        );

    });


    renderLiveMatches(filteredLive);


    const filteredHistory =
    filterHistory(search);


    historyShown = 6;

    renderHistory(filteredHistory);

}


/* =========================================
   HISTORY SEARCH FILTER
========================================= */

function filterHistory(search) {

    if (!search) {
        return matchHistory;
    }


    return matchHistory.filter(match => {

        const teams =
        Array.isArray(match.teams)
        ? match.teams.join(" ")
        : (match.teams || "");


        return (

            teams
            .toLowerCase()
            .includes(search)

            ||

            (match.competition || "")
            .toLowerCase()
            .includes(search)

            ||

            (match.result || "")
            .toLowerCase()
            .includes(search)

            ||

            (match.date || "")
            .toLowerCase()
            .includes(search)

            ||

            (match.venue || "")
            .toLowerCase()
            .includes(search)

            ||

            (match.format || "")
            .toLowerCase()
            .includes(search)

        );

    });

}


/* =========================================
   FULL SCORECARD
========================================= */

async function showScorecard(id) {

    const section =
    document.getElementById("scorecardSection");

    const container =
    document.getElementById("scorecard");


    section.classList.remove("hidden");

    container.innerHTML = `
    <div class="message">
    ⏳ Loading full scorecard...
    </div>
    `;


    section.scrollIntoView({
        behavior: "smooth"
    });


    try {

        const response =
        await fetch(
            "data/scorecards/" +
            encodeURIComponent(id) +
            ".json"
        );


        if (!response.ok) {

            throw new Error(
                "Scorecard not found"
            );

        }


        const match =
        await response.json();


        renderFullScorecard(match);

    }

    catch(error) {

        console.error(error);

        container.innerHTML = `
        <div class="error">
        ❌ Couldn't load this scorecard.
        <br><br>
        Match ID: ${escapeHTML(id)}
        </div>
        `;

    }

}


/* =========================================
   RENDER FULL SCORECARD
========================================= */

function renderFullScorecard(match) {

    const container =
    document.getElementById("scorecard");


    const teams =
    Array.isArray(match.teams)
    ? match.teams.join(" vs ")
    : match.teams;


    let html = `

    <div class="scorecard-box">

        <h2>
        🏏 ${escapeHTML(teams || "Cricket Match")}
        </h2>

        <p>
        📅 ${escapeHTML(match.date || "Unknown date")}
        </p>

        <p>
        🏏 ${escapeHTML(match.format || "Unknown format")}
        </p>

        <p>
        🏆 ${escapeHTML(match.competition || "Cricket")}
        </p>

        <p>
        📍 ${escapeHTML(match.venue || "Unknown venue")}
        </p>

        <p class="result">
        🏆 ${escapeHTML(match.result || "Result unavailable")}
        </p>

        ${
        match.winner
        ?
        `
        <p>
        🥇 Winner:
        <strong>
        ${escapeHTML(match.winner)}
        </strong>
        </p>
        `
        :
        ""
        }

    </div>

    `;


    if (!match.innings || !match.innings.length) {

        html += `
        <div class="scorecard-box">
        <p>No innings data available.</p>
        </div>
        `;

        container.innerHTML =
        html;

        return;

    }


    match.innings.forEach((innings, index) => {

        const inningsNumber =
        index + 1;

        const team =
        innings.team ||
        "Team";


        html += `

        <div class="scorecard-box">

        <h3>
        ${inningsNumber}. ${escapeHTML(team)}
        </h3>

        <div class="scorecard-total">
        ${innings.runs || 0}
        ${
        innings.all_out
        ? "/all out"
        : ""
        }

        ${
        innings.balls
        ? `
        <span style="font-size:14px;font-weight:normal;">
        (${formatOvers(innings.balls)} overs)
        </span>
        `
        : ""
        }

        </div>

        `;


        /* ===============================
           BATTING
        =============================== */

        if (
            innings.batting &&
            innings.batting.length
        ) {

            html += `

            <h3>
            🏏 Batting
            </h3>

            <table class="scorecard-table">

            <thead>

            <tr>
            <th>Player</th>
            <th>R</th>
            <th>B</th>
            <th>4s</th>
            <th>6s</th>
            <th>SR</th>
            <th>Status</th>
            </tr>

            </thead>

            <tbody>
            `;


            innings.batting.forEach(player => {

                html += `

                <tr>

                <td>
                <strong>
                ${escapeHTML(player.player || "")}
                </strong>
                </td>

                <td>
                ${player.runs ?? 0}
                </td>

                <td>
                ${player.balls ?? 0}
                </td>

                <td>
                ${player.fours ?? 0}
                </td>

                <td>
                ${player.sixes ?? 0}
                </td>

                <td>
                ${player.strike_rate ?? "-"}
                </td>

                <td>
                ${
                player.out
                ? "Out"
                : "Not out"
                }
                </td>

                </tr>

                `;

            });


            html += `

            </tbody>

            </table>

            `;

        }


        /* ===============================
           INNINGS EXTRAS
        =============================== */

        html += `

        <div class="competition">
        Extras: ${innings.extras ?? 0}
        </div>

        `;


        /* ===============================
           BOWLING
        =============================== */

        if (
            innings.bowling &&
            innings.bowling.length
        ) {

            html += `

            <h3>
            🎯 Bowling
            </h3>

            <table class="scorecard-table">

            <thead>

            <tr>
            <th>Bowler</th>
            <th>Overs</th>
            <th>Runs</th>
            <th>Wickets</th>
            <th>Economy</th>
            </tr>

            </thead>

            <tbody>

            `;


            innings.bowling.forEach(bowler => {

                html += `

                <tr>

                <td>
                <strong>
                ${escapeHTML(bowler.player || "")}
                </strong>
                </td>

                <td>
                ${escapeHTML(bowler.overs ?? "-")}
                </td>

                <td>
                ${bowler.runs ?? 0}
                </td>

                <td>
                ${bowler.wickets ?? 0}
                </td>

                <td>
                ${bowler.economy ?? "-"}
                </td>

                </tr>

                `;

            });


            html += `

            </tbody>

            </table>

            `;

        }


        html += `
        </div>
        `;

    });


    container.innerHTML =
    html;

}


/* =========================================
   OVERS CALCULATOR
========================================= */

function formatOvers(balls) {

    const number =
    Number(balls);

    if (!Number.isFinite(number)) {
        return "-";
    }

    const overs =
    Math.floor(number / 6);

    const remainingBalls =
    number % 6;

    return (
        overs +
        "." +
        remainingBalls
    );

}


/* =========================================
   HTML SAFETY
========================================= */

function escapeHTML(value) {

    return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   CLOSE SCORECARD
========================================= */

function closeScorecard() {

    document
    .getElementById("scorecardSection")
    .classList.add("hidden");

}


/* =========================================
   START
========================================= */

loadLiveScores();

loadMatchHistory();


/* =========================================
   AUTO REFRESH LIVE SCORES
========================================= */

setInterval(
    loadLiveScores,
    60000
);

</script>

</script>

</body>
</html>
```
