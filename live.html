/* =========================================
   LIVE SCORES
========================================= */


const API =
    "https://sportscore.com/api/widget/matches/?sport=cricket&limit=50";


let liveMatches = [];


async function loadLiveScores() {

    const status =
        document.getElementById("liveStatus");

    const container =
        document.getElementById("matches");


    status.textContent =
        "Loading live scores...";

    container.innerHTML = "";


    try {

        const response =
            await fetch(API);


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        console.log(
            "SportScore data:",
            data
        );


        liveMatches =
            data.matches || [];


        renderLiveMatches(
            liveMatches
        );


    } catch (error) {

        console.error(error);


        status.innerHTML = `
            <div class="error">

                ❌ Couldn't load live scores.

                <br><br>

                Try the Refresh button.

            </div>
        `;

    }

}


/* =========================================
   RENDER LIVE MATCHES
========================================= */


function renderLiveMatches(list) {

    const container =
        document.getElementById("matches");

    const status =
        document.getElementById("liveStatus");


    container.innerHTML = "";


    if (!list.length) {

        status.textContent =
            "No matches found.";

        return;

    }


    status.textContent =
        list.length +
        " cricket matches found";


    list.forEach(match => {

        const card =
            document.createElement("div");


        card.className =
            "match";


        const home =
            match.home ||
            "Unknown Team";


        const away =
            match.away ||
            "Unknown Team";


        const homeScore =
            match.home_score ?? "-";


        const awayScore =
            match.away_score ?? "-";


        const matchStatus =
            match.status ||
            "Match information";


        card.innerHTML = `

            <div class="match-title">
                🏏 Cricket Match
            </div>


            <div class="team">
                ${home}
            </div>


            <div class="score">
                ${homeScore}
            </div>


            <div class="team">
                ${away}
            </div>


            <div class="score">
                ${awayScore}
            </div>


            <div class="match-status">
                ${String(matchStatus).toUpperCase()}
            </div>

        `;


        container.appendChild(card);

    });

}

/* =========================================

========================================= */


function renderHistory(list) {

    const container =
        document.getElementById("history");

    const loadButton =
        document.getElementById("loadMoreBtn");


    container.innerHTML = "";


    const visible =
        list.slice(0, historyShown);


    visible.forEach(match => {

        const card =
            document.createElement("div");


        card.className =
            "match history-card";


        card.innerHTML = `

            <div class="match-title">
                🏏 ${match.teams}
            </div>


            <div class="date">
                📅 ${match.date}
            </div>


            <div class="score">
                ${match.score}
            </div>


            <div class="result">
                🏆 ${match.result}
            </div>


            <div class="competition">
                ${match.competition}
            </div>

        `;


        container.appendChild(card);

    });


    if (
        historyShown >= list.length
    ) {

        loadButton.classList.add(
            "hidden"
        );

    } else {

        loadButton.classList.remove(
            "hidden"
        );

    }


    if (!list.length) {

        container.innerHTML = `
            <div class="message">
                ❌ No matches found.
            </div>
        `;

        loadButton.classList.add(
            "hidden"
        );

    }

}


/* =========================================
   LOAD MORE
========================================= */


function loadMoreHistory() {

    historyShown += 6;


    const search =
        document.getElementById("searchBar")
        .value
        .toLowerCase();


    const filtered =
        matchHistory.filter(match => {

            return (
                match.teams
                    .toLowerCase()
                    .includes(search)
                ||
                match.competition
                    .toLowerCase()
                    .includes(search)
                ||
                match.result
                    .toLowerCase()
                    .includes(search)
            );

        });


    renderHistory(filtered);

}


/* =========================================
   SEARCH EVERYTHING
========================================= */


function searchEverything() {

    const search =
        document.getElementById("searchBar")
        .value
        .toLowerCase()
        .trim();


    /* Search live matches */

    const filteredLive =
        liveMatches.filter(match => {

            const home =
                (match.home || "")
                    .toLowerCase();

            const away =
                (match.away || "")
                    .toLowerCase();

            return (
                home.includes(search)
                ||
                away.includes(search)
            );

        });


    renderLiveMatches(
        filteredLive
    );


    /* Search history */

    const filteredHistory =
        matchHistory.filter(match => {

            return (
                match.teams
                    .toLowerCase()
                    .includes(search)
                ||
                match.competition
                    .toLowerCase()
                    .includes(search)
                ||
                match.result
                    .toLowerCase()
                    .includes(search)
            );

        });


    historyShown = 6;

    renderHistory(
        filteredHistory
    );

}
